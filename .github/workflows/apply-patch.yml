name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/patch_0_2_19.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.2.19"' Sources/RGSibilanceStudio.swift
          grep -F '"Č"' Sources/RGSibilanceStudio.swift
          grep -F '"Ť"' Sources/RGSibilanceStudio.swift
          grep -F 'onEventBoundsChanged' Sources/RGSibilanceStudio.swift
          grep -F 'REGION →' Sources/RGSibilanceStudio.swift
      - name: Commit source and version
        run: |
          printf '0.2.19\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift VERSION
          git commit -m "Release 0.2.19 phoneme regions and editable bounds"
          git push
