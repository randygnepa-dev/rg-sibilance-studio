name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/patch_0_4_3_loop.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.4.3"' Sources/RGSibilanceStudio.swift
          grep -F 'onLoopRangeChanged' Sources/RGSibilanceStudio.swift
          grep -F 'drawLoopRange' Sources/RGSibilanceStudio.swift
          grep -F 'toggleTimelineLoop' Sources/RGSibilanceStudio.swift
          grep -F 'Ruler drag: LOOP' Sources/RGSibilanceStudio.swift
          grep -F '@main' Sources/RGSibilanceStudio.swift
      - name: Commit source and version
        run: |
          printf '0.4.3\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift VERSION
          git commit -m "Release 0.4.3 timeline loop playback"
          git push
