name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/patch_0_2_24.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.2.24"' Sources/RGSibilanceStudio.swift
          grep -F 'final class AudioDropView' Sources/RGSibilanceStudio.swift
          grep -F 'DRAG & DROP WAV / AIFF' Sources/RGSibilanceStudio.swift
          grep -F 'Export RG-SIB' Sources/RGSibilanceStudio.swift
          grep -F 'Reference Morph' Sources/RGSibilanceStudio.swift
          grep -F 'zoomInTimeline' Sources/RGSibilanceStudio.swift
      - name: Commit source and version
        run: |
          printf '0.2.24\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift VERSION
          git commit -m "Release 0.2.24 reference interface redesign"
          git push
