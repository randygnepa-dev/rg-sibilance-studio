name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/patch_0_2_20.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.2.20"' Sources/RGSibilanceStudio.swift
          grep -F 'var gainDB: Double = 0' Sources/RGSibilanceStudio.swift
          grep -F 'var fadeIn: Double = 0.012' Sources/RGSibilanceStudio.swift
          grep -F 'onPlayEvent' Sources/RGSibilanceStudio.swift
          grep -F 'playRegionOnly' Sources/RGSibilanceStudio.swift
          grep -F 'CROSSFADES' Sources/RGSibilanceStudio.swift
      - name: Commit source and version
        run: |
          printf '0.2.20\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift VERSION
          git commit -m "Release 0.2.20 region preview gain and fades"
          git push
