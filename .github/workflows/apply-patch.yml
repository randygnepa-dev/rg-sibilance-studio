name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/patch_0_3_0.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.3.0"' Sources/RGSibilanceStudio.swift
          grep -F 'final class RGButton' Sources/RGSibilanceStudio.swift
          grep -F 'WAVEFORM' Sources/RGSibilanceStudio.swift
          grep -F 'SPECTROGRAM' Sources/RGSibilanceStudio.swift
          grep -F 'EDITS & ANNOTATIONS' Sources/RGSibilanceStudio.swift
          grep -F 'refreshAnnotationSidebar' Sources/RGSibilanceStudio.swift
          grep -F 'expectedHash' Sources/RGSibilanceStudio.swift
          grep -F 'applyPrebuilt' Sources/RGSibilanceStudio.swift
          grep -F '@main' Sources/RGSibilanceStudio.swift
      - name: Commit source and version
        run: |
          printf '0.3.0\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift VERSION
          git commit -m "Release 0.3.0 beta visual shell"
          git push
