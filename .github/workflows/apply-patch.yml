name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Sources/RGSibilanceStudio.swift')
          s = p.read_text()

          s = s.replace('let RGVersion = "0.2.15"', 'let RGVersion = "0.2.16"', 1)

          old = '''    var onAddSibilance: ((Double) -> Void)?
    var onDeleteEvent: ((Int) -> Void)?'''
          new = '''    var onAddSibilance: ((Double) -> Void)?
    var onDeleteEvent: ((Int) -> Void)?'''
          if old not in s:
              raise SystemExit('timeline callback marker missing')

          old = '''    private var contextTime: Double = 0
    private var contextEventIndex: Int?'''
          new = '''    private var contextTime: Double = 0
    private var contextEventIndex: Int?
    private var rulerDragging = false
    private var highlightedTime: Double?'''
          if old not in s:
              raise SystemExit('timeline state marker missing')
          s = s.replace(old, new, 1)

          old = '''    private var plotRect: NSRect {
        NSRect(x: 54, y: 30, width: max(120, bounds.width - 76), height: max(90, bounds.height - 52))
    }'''
          new = '''    private var plotRect: NSRect {
        NSRect(x: 54, y: 34, width: max(120, bounds.width - 76), height: max(90, bounds.height - 58))
    }

    private var rulerRect: NSRect {
        NSRect(x: plotRect.minX, y: 0, width: plotRect.width, height: 32)
    }'''
          if old not in s:
              raise SystemExit('plot rect marker missing')
          s = s.replace(old, new, 1)

          old = '''    override func mouseDown(with event: NSEvent) {
        guard model != nil else { return }
        let p = convert(event.locationInWindow, from: nil)
        guard plotRect.contains(p) else { return }
        window?.makeFirstResponder(self)
        lastDragX = p.x
        panning = event.modifierFlags.contains(.option)
        scrubbing = !panning
        if scrubbing {
            let t = timeForX(p.x)
            playhead = t
            onScrub?(t, true)
            selectNearestEvent(at: t)
        }
    }'''
          new = '''    override func mouseDown(with event: NSEvent) {
        guard model != nil else { return }
        let p = convert(event.locationInWindow, from: nil)
        window?.makeFirstResponder(self)

        if rulerRect.contains(p) {
            rulerDragging = true
            lastDragX = p.x
            let t = timeForX(p.x)
            playhead = t
            highlightedTime = t
            needsDisplay = true
            return
        }

        guard plotRect.contains(p) else { return }
        lastDragX = p.x
        panning = event.modifierFlags.contains(.option)
        scrubbing = !panning
        if scrubbing {
            let t = timeForX(p.x)
            playhead = t
            highlightedTime = t
            onScrub?(t, true)
            selectNearestEvent(at: t)
        }
    }'''
          if old not in s:
              raise SystemExit('mouseDown marker missing')
          s = s.replace(old, new, 1)

          old = '''    override func mouseDragged(with event: NSEvent) {
        let p = convert(event.locationInWindow, from: nil)
        if panning {
            let dx = p.x - lastDragX
            viewStart -= Double(dx / max(1, plotRect.width)) * visibleDuration
            clampViewStart()
            lastDragX = p.x
            needsDisplay = true
        } else if scrubbing {
            let t = timeForX(p.x)
            playhead = t
            onScrub?(t, true)
        }
    }'''
          new = '''    override func mouseDragged(with event: NSEvent) {
        let p = convert(event.locationInWindow, from: nil)
        if rulerDragging {
            let dx = p.x - lastDragX
            viewStart -= Double(dx / max(1, plotRect.width)) * visibleDuration
            clampViewStart()
            lastDragX = p.x
            let t = timeForX(min(max(p.x, plotRect.minX), plotRect.maxX))
            playhead = t
            highlightedTime = t
            needsDisplay = true
        } else if panning {
            let dx = p.x - lastDragX
            viewStart -= Double(dx / max(1, plotRect.width)) * visibleDuration
            clampViewStart()
            lastDragX = p.x
            needsDisplay = true
        } else if scrubbing {
            let t = timeForX(p.x)
            playhead = t
            highlightedTime = t
            onScrub?(t, true)
        }
    }'''
          if old not in s:
              raise SystemExit('mouseDragged marker missing')
          s = s.replace(old, new, 1)

          old = '''    override func mouseUp(with event: NSEvent) {
        if scrubbing { onScrub?(playhead, false) }
        scrubbing = false
        panning = false
    }'''
          new = '''    override func mouseUp(with event: NSEvent) {
        if scrubbing { onScrub?(playhead, false) }
        scrubbing = false
        panning = false
        rulerDragging = false
        needsDisplay = true
    }

    func followPlayback(to time: Double) {
        playhead = time
        highlightedTime = time
        guard let m = model, m.duration > 0, zoom > 1.02 else { return }
        let leftEdge = viewStart + visibleDuration * 0.12
        let rightEdge = viewStart + visibleDuration * 0.78
        if time > rightEdge {
            viewStart = time - visibleDuration * 0.62
            clampViewStart()
        } else if time < leftEdge {
            viewStart = time - visibleDuration * 0.12
            clampViewStart()
        }
        needsDisplay = true
    }'''
          if old not in s:
              raise SystemExit('mouseUp marker missing')
          s = s.replace(old, new, 1)

          old = '''    private func drawTimeScale(_ m: AudioModel) {
        let attrs: [NSAttributedString.Key: Any] = [.font: NSFont.systemFont(ofSize: 9), .foregroundColor: NSColor(hex: 0x6E7E8B)]
        for i in 0...5 {
            let t = viewStart + visibleDuration * Double(i) / 5
            let min = Int(t) / 60
            let sec = Int(t) % 60
            let text = String(format: "%d:%02d", min, sec)
            let x = plotRect.minX + plotRect.width * CGFloat(i) / 5
            text.draw(at: NSPoint(x: x - 12, y: 8), withAttributes: attrs)
        }
    }'''
          new = '''    private func drawTimeScale(_ m: AudioModel) {
        NSColor(hex: 0x0A141D).setFill()
        rulerRect.fill()
        let attrs: [NSAttributedString.Key: Any] = [.font: NSFont.monospacedDigitSystemFont(ofSize: 9, weight: .regular), .foregroundColor: NSColor(hex: 0x718493)]
        for i in 0...5 {
            let t = viewStart + visibleDuration * Double(i) / 5
            let min = Int(t) / 60
            let sec = Int(t) % 60
            let text = String(format: "%d:%02d", min, sec)
            let x = plotRect.minX + plotRect.width * CGFloat(i) / 5
            text.draw(at: NSPoint(x: x - 12, y: 9), withAttributes: attrs)
        }
        if let t = highlightedTime, t >= viewStart && t <= viewEnd {
            let x = xForTime(t)
            let text = String(format: "%d:%02d.%03d", Int(t) / 60, Int(t) % 60, Int((t - floor(t)) * 1000))
            let a: [NSAttributedString.Key: Any] = [.font: NSFont.monospacedDigitSystemFont(ofSize: 10, weight: .semibold), .foregroundColor: NSColor.white]
            let size = text.size(withAttributes: a)
            let box = NSRect(x: min(max(plotRect.minX, x - size.width / 2 - 7), plotRect.maxX - size.width - 14), y: 4, width: size.width + 14, height: 20)
            NSColor(hex: 0x176BC1).setFill()
            NSBezierPath(roundedRect: box, xRadius: 5, yRadius: 5).fill()
            text.draw(at: NSPoint(x: box.minX + 7, y: box.minY + 4), withAttributes: a)
        }
    }'''
          if old not in s:
              raise SystemExit('time scale marker missing')
          s = s.replace(old, new, 1)

          s = s.replace(
              '"Scroll: zoom   •   drag: scrub   •   ⌥ drag: pan   •   right-click: add/delete S   •   Delete: remove selected"',
              '"Scroll: zoom   •   drag waveform: scrub   •   drag time ruler: move timeline   •   ⌥ drag: pan   •   Space: play/stop"',
              1
          )

          old = '''    private var loopButton: NSButton!'''
          new = '''    private var loopButton: NSButton!
    private var kindPopup: NSPopUpButton!
    private var stopMode: NSSegmentedControl!'''
          if old not in s:
              raise SystemExit('UI property marker missing')
          s = s.replace(old, new, 1)

          old = '''    private var stopTimer: Timer?
    private var loopEnabled = false'''
          new = '''    private var stopTimer: Timer?
    private var loopEnabled = false
    private var keyMonitor: Any?
    private var transportTimer: Timer?
    private var transportPlaying = false
    private var transportStartTime: Double = 0'''
          if old not in s:
              raise SystemExit('transport state marker missing')
          s = s.replace(old, new, 1)

          old = '''        updater.start()
        showUpdateNoticeIfNeeded()'''
          new = '''        updater.start()
        showUpdateNoticeIfNeeded()
        installKeyboardTransport()'''
          if old not in s:
              raise SystemExit('launch marker missing')
          s = s.replace(old, new, 1)

          old = '''        let rs = label("Repair Strength", size: 11); rs.frame = NSRect(x: 15, y: panelH - 111, width: 105, height: 18); p2.addSubview(rs)'''
          new = '''        let typeLabel = label("Detected type", size: 11)
        typeLabel.frame = NSRect(x: 15, y: panelH - 111, width: 90, height: 18)
        p2.addSubview(typeLabel)
        kindPopup = NSPopUpButton(frame: NSRect(x: 108, y: panelH - 116, width: 118, height: 25), pullsDown: false)
        kindPopup.addItems(withTitles: ["S", "Š", "Z", "C", "T", "D", "P", "B", "F", "CH", "OTHER"])
        kindPopup.target = self
        kindPopup.action = #selector(kindChanged)
        kindPopup.isEnabled = false
        p2.addSubview(kindPopup)

        let rs = label("Repair Strength", size: 11); rs.frame = NSRect(x: 15, y: panelH - 146, width: 105, height: 18); p2.addSubview(rs)'''
          if old not in s:
              raise SystemExit('event panel marker missing')
          s = s.replace(old, new, 1)

          old = '''        repairSlider.frame = NSRect(x: 119, y: panelH - 114, width: pw - 150, height: 22)'''
          new = '''        repairSlider.frame = NSRect(x: 119, y: panelH - 149, width: pw - 150, height: 22)'''
          if old not in s:
              raise SystemExit('repair slider marker missing')
          s = s.replace(old, new, 1)

          old = '''        loopButton.frame = NSRect(x: 139, y: panelH - 73, width: 95, height: 30)
        p3.addSubview(loopButton)'''
          new = '''        loopButton.frame = NSRect(x: 139, y: panelH - 73, width: 95, height: 30)
        p3.addSubview(loopButton)
        let stopLabel = label("SPACE stop", size: 10, color: NSColor(hex: 0x7F909D))
        stopLabel.frame = NSRect(x: 15, y: panelH - 112, width: 80, height: 18)
        p3.addSubview(stopLabel)
        stopMode = NSSegmentedControl(labels: ["CONTINUE", "RETURN"], trackingMode: .selectOne, target: self, action: nil)
        stopMode.selectedSegment = 0
        stopMode.frame = NSRect(x: 92, y: panelH - 117, width: 174, height: 27)
        p3.addSubview(stopMode)'''
          if old not in s:
              raise SystemExit('preview panel marker missing')
          s = s.replace(old, new, 1)

          old = '''        let e = events[i]
        eventInfo.stringValue = String(format: "#%03d   %@   %.3f–%.3f s   score %.2f   %@", i + 1, e.kind, e.start, e.end, e.score, e.userLabel.isEmpty ? "UNRATED" : e.userLabel)'''
          new = '''        let e = events[i]
        kindPopup.isEnabled = true
        kindPopup.selectItem(withTitle: e.kind)
        eventInfo.stringValue = String(format: "#%03d   %@   %.3f–%.3f s   score %.2f   %@", i + 1, e.kind, e.start, e.end, e.score, e.userLabel.isEmpty ? "UNRATED" : e.userLabel)'''
          if old not in s:
              raise SystemExit('select event marker missing')
          s = s.replace(old, new, 1)

          marker = '''    private func mark(_ value: String) {'''
          insert = '''    @objc private func kindChanged() {
        guard let i = timeline.selectedIndex, events.indices.contains(i), let title = kindPopup.selectedItem?.title else { return }
        events[i].kind = title
        timeline.events = events
        selectEvent(i)
        status.stringValue = "EVENT #\(i + 1) TYPE → \(title)"
    }

'''
          if marker not in s:
              raise SystemExit('kind insert marker missing')
          s = s.replace(marker, insert + marker, 1)

          old = '''        if events.isEmpty {
            timeline.selectedIndex = nil
            eventInfo.stringValue = "No sibilance selected"
        } else {'''
          new = '''        if events.isEmpty {
            timeline.selectedIndex = nil
            kindPopup.isEnabled = false
            eventInfo.stringValue = "No sibilance selected"
        } else {'''
          if old not in s:
              raise SystemExit('delete marker missing')
          s = s.replace(old, new, 1)

          marker = '''    private func scrub(to time: Double, active: Bool) {'''
          insert = '''    private func installKeyboardTransport() {
        keyMonitor = NSEvent.addLocalMonitorForEvents(matching: .keyDown) { [weak self] event in
            guard let self = self else { return event }
            if event.keyCode == 49 && !event.modifierFlags.contains(.command) && !event.modifierFlags.contains(.control) {
                self.toggleTransport()
                return nil
            }
            return event
        }
    }

    private func toggleTransport() {
        transportPlaying ? stopTransport() : startTransport()
    }

    private func startTransport() {
        guard let p = scrubPlayer, model.duration > 0 else { return }
        previewPlayer?.stop()
        stopTimer?.invalidate()
        transportStartTime = min(max(0, timeline.playhead), max(0, p.duration - 0.01))
        p.currentTime = transportStartTime
        p.play()
        transportPlaying = true
        playButton.title = "■ Stop"
        status.stringValue = stopMode.selectedSegment == 1 ? "PLAYING — Space returns to start" : "PLAYING — Space continues from stop"
        transportTimer?.invalidate()
        transportTimer = Timer.scheduledTimer(withTimeInterval: 1.0 / 30.0, repeats: true) { [weak self] _ in
            guard let self = self, let player = self.scrubPlayer else { return }
            self.timeline.followPlayback(to: player.currentTime)
            if !player.isPlaying && self.transportPlaying {
                self.transportPlaying = false
                self.transportTimer?.invalidate()
                self.playButton.title = "▶ Play event"
                self.status.stringValue = "PLAYBACK END"
            }
        }
    }

    private func stopTransport() {
        guard let p = scrubPlayer else { return }
        let stoppedAt = p.currentTime
        p.pause()
        transportPlaying = false
        transportTimer?.invalidate()
        transportTimer = nil
        if stopMode.selectedSegment == 1 {
            p.currentTime = transportStartTime
            timeline.followPlayback(to: transportStartTime)
            status.stringValue = "STOP — returned to start"
        } else {
            timeline.followPlayback(to: stoppedAt)
            status.stringValue = "STOP — locator stays at stop position"
        }
        playButton.title = "▶ Play event"
    }

'''
          if marker not in s:
              raise SystemExit('transport insert marker missing')
          s = s.replace(marker, insert + marker, 1)

          old = '''    private func scrub(to time: Double, active: Bool) {
        guard let p = scrubPlayer else { return }
        if active {'''
          new = '''    private func scrub(to time: Double, active: Bool) {
        guard let p = scrubPlayer else { return }
        if transportPlaying { stopTransport() }
        if active {'''
          if old not in s:
              raise SystemExit('scrub marker missing')
          s = s.replace(old, new, 1)

          old = '''    func applicationShouldTerminateAfterLastWindowClosed(_ sender: NSApplication) -> Bool { true }'''
          new = '''    func applicationWillTerminate(_ notification: Notification) {
        if let monitor = keyMonitor { NSEvent.removeMonitor(monitor) }
    }

    func applicationShouldTerminateAfterLastWindowClosed(_ sender: NSApplication) -> Bool { true }'''
          if old not in s:
              raise SystemExit('terminate marker missing')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Validate patch markers
        shell: bash
        run: |
          grep -F 'let RGVersion = "0.2.16"' Sources/RGSibilanceStudio.swift
          grep -F 'kindPopup.addItems' Sources/RGSibilanceStudio.swift
          grep -F 'SPACE stop' Sources/RGSibilanceStudio.swift
          grep -F 'private func toggleTransport' Sources/RGSibilanceStudio.swift
          grep -F 'func followPlayback' Sources/RGSibilanceStudio.swift
          grep -F 'rulerDragging' Sources/RGSibilanceStudio.swift

      - name: Commit source and version
        shell: bash
        run: |
          printf '0.2.16\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift VERSION
          git commit -m "Release 0.2.16 transport ruler and event typing"
          git push
