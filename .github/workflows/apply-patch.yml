name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/fix_0_2_23_updater.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.2.23"' Sources/RGSibilanceStudio.swift
          grep -F 'RGAdvancedEngine-' Sources/RGSibilanceStudio.swift
          grep -F 'helper.path' Sources/RGSibilanceStudio.swift
          grep -F 'Export RG-SIB' Sources/RGSibilanceStudio.swift
      - name: Commit source and version
        run: |
          printf '0.2.23\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift VERSION
          git commit -m "Fix 0.2.23 updater advanced engine compilation"
          git push
