name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/fix_0_4_0_swift6.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.4.0"' Sources/RGSibilanceStudio.swift
          grep -F 'CLEAN PRO 0.4.0' Sources/RGSibilanceStudio.swift
          grep -F 'final class RGSpectralShapeView' Sources/RGSibilanceStudio.swift
          ! grep -F '=.' Sources/RGSibilanceStudio.swift
          grep -F '@main' Sources/RGSibilanceStudio.swift
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift
          git commit -m "Fix Swift 6 syntax in 0.4.0 Clean Pro"
          git push
