name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/patch_0_2_27.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.2.27"' Sources/RGSibilanceStudio.swift
          grep -F '@main' Sources/RGSibilanceStudio.swift
          grep -F 'struct RGSibilanceStudioMain' Sources/RGSibilanceStudio.swift
          ! grep -F 'mv build-src/RGSibilanceStudio.swift build-src/main.swift' .github/workflows/build-macos.yml
      - name: Commit source and version
        run: |
          printf '0.2.27\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift .github/workflows/build-macos.yml VERSION
          git commit -m "Release 0.2.27 updater compile compatibility"
          git push
