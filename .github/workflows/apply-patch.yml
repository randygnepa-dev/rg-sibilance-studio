name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('Sources/RGSibilanceStudio.swift')
          s = p.read_text()

          s = s.replace('let RGVersion = "0.2.14"', 'let RGVersion = "0.2.15"', 1)

          old = '''    var onSelect: ((Int) -> Void)?
    var onScrub: ((Double, Bool) -> Void)?
    var onAudioDrop: ((URL) -> Void)?'''
          new = '''    var onSelect: ((Int) -> Void)?
    var onScrub: ((Double, Bool) -> Void)?
    var onAudioDrop: ((URL) -> Void)?
    var onAddSibilance: ((Double) -> Void)?
    var onDeleteEvent: ((Int) -> Void)?'''
          if old not in s: raise SystemExit('Timeline callback marker missing')
          s = s.replace(old, new, 1)

          old = '''    private var lastDragX: CGFloat = 0
    private var dragActive = false'''
          new = '''    private var lastDragX: CGFloat = 0
    private var dragActive = false
    private var contextTime: Double = 0
    private var contextEventIndex: Int?'''
          if old not in s: raise SystemExit('Timeline state marker missing')
          s = s.replace(old, new, 1)

          old = '''    required init?(coder: NSCoder) { fatalError("init(coder:) has not been implemented") }

    private var plotRect: NSRect {'''
          new = '''    required init?(coder: NSCoder) { fatalError("init(coder:) has not been implemented") }

    override var acceptsFirstResponder: Bool { true }

    private var plotRect: NSRect {'''
          if old not in s: raise SystemExit('Responder marker missing')
          s = s.replace(old, new, 1)

          marker = '''    override func mouseDown(with event: NSEvent) {'''
          insert = '''    private func eventIndexNear(x: CGFloat, tolerance: CGFloat = 11) -> Int? {
        var best: Int?
        var distance = CGFloat.greatestFiniteMagnitude
        for (i, e) in events.enumerated() where e.peakTime >= viewStart && e.peakTime <= viewEnd {
            let d = abs(xForTime(e.peakTime) - x)
            if d <= tolerance && d < distance {
                distance = d
                best = i
            }
        }
        return best
    }

    override func rightMouseDown(with event: NSEvent) {
        guard model != nil else { return }
        let p = convert(event.locationInWindow, from: nil)
        guard plotRect.contains(p) else { return }
        contextTime = timeForX(p.x)
        contextEventIndex = eventIndexNear(x: p.x)
        playhead = contextTime
        window?.makeFirstResponder(self)

        let menu = NSMenu()
        if let i = contextEventIndex {
            selectedIndex = i
            onSelect?(i)
            let item = NSMenuItem(title: "Delete Sibilance", action: #selector(contextDeleteSibilance), keyEquivalent: "")
            item.target = self
            menu.addItem(item)
        } else {
            let item = NSMenuItem(title: "Add Sibilance", action: #selector(contextAddSibilance), keyEquivalent: "")
            item.target = self
            menu.addItem(item)
        }
        NSMenu.popUpContextMenu(menu, with: event, for: self)
    }

    @objc private func contextAddSibilance() {
        onAddSibilance?(contextTime)
    }

    @objc private func contextDeleteSibilance() {
        guard let i = contextEventIndex else { return }
        onDeleteEvent?(i)
        contextEventIndex = nil
    }

    override func keyDown(with event: NSEvent) {
        if (event.keyCode == 51 || event.keyCode == 117), let i = selectedIndex {
            onDeleteEvent?(i)
            return
        }
        super.keyDown(with: event)
    }

'''
          if marker not in s: raise SystemExit('mouseDown marker missing')
          s = s.replace(marker, insert + marker, 1)

          old = '''        lastDragX = p.x
        panning = event.modifierFlags.contains(.option)'''
          new = '''        window?.makeFirstResponder(self)
        lastDragX = p.x
        panning = event.modifierFlags.contains(.option)'''
          if old not in s: raise SystemExit('mouse focus marker missing')
          s = s.replace(old, new, 1)

          old = '''        timeline.onAudioDrop = { [weak self] url in self?.loadAudio(url) }
        timeline.onSelect = { [weak self] i in self?.selectEvent(i) }
        timeline.onScrub = { [weak self] t, active in self?.scrub(to: t, active: active) }'''
          new = '''        timeline.onAudioDrop = { [weak self] url in self?.loadAudio(url) }
        timeline.onSelect = { [weak self] i in self?.selectEvent(i) }
        timeline.onScrub = { [weak self] t, active in self?.scrub(to: t, active: active) }
        timeline.onAddSibilance = { [weak self] t in self?.addManualS(at: t) }
        timeline.onDeleteEvent = { [weak self] i in self?.deleteEvent(i) }'''
          if old not in s: raise SystemExit('Timeline wiring marker missing')
          s = s.replace(old, new, 1)

          old = '''    @objc private func markManualS() {
        guard model.duration > 0 else { return }
        let t = timeline.playhead
        let e = SibilanceEvent(start: max(0, t - 0.05), end: min(model.duration, t + 0.10), peakTime: t, score: 1, kind: "S", userLabel: "")
        events.append(e)
        events.sort { $0.peakTime < $1.peakTime }
        timeline.events = events
        if let i = events.firstIndex(where: { abs($0.peakTime - t) < 0.0001 }) { selectEvent(i) }
    }'''
          new = '''    @objc private func markManualS() {
        addManualS(at: timeline.playhead)
    }

    private func addManualS(at t: Double) {
        guard model.duration > 0 else { return }
        let clamped = min(max(0, t), model.duration)
        let e = SibilanceEvent(start: max(0, clamped - 0.05), end: min(model.duration, clamped + 0.10), peakTime: clamped, score: 1, kind: "S", userLabel: "TARGET")
        events.append(e)
        events.sort { $0.peakTime < $1.peakTime }
        timeline.events = events
        timeline.playhead = clamped
        detectedLabel.stringValue = "Detected: \\(events.count) events"
        if let i = events.firstIndex(where: { abs($0.peakTime - clamped) < 0.0001 }) { selectEvent(i) }
        status.stringValue = "MANUAL SIBILANCE ADDED"
    }

    private func deleteEvent(_ i: Int) {
        guard events.indices.contains(i) else { return }
        events.remove(at: i)
        timeline.events = events
        detectedLabel.stringValue = "Detected: \\(events.count) events"
        if events.isEmpty {
            timeline.selectedIndex = nil
            eventInfo.stringValue = "No sibilance selected"
        } else {
            let next = min(i, events.count - 1)
            selectEvent(next)
            timeline.playhead = events[next].peakTime
        }
        status.stringValue = "SIBILANCE REMOVED"
    }'''
          if old not in s: raise SystemExit('Manual S marker missing')
          s = s.replace(old, new, 1)

          old = '"Scroll: zoom   •   horizontal scroll: pan   •   drag: scrub/listen   •   ⌥ drag: pan"'
          new = '"Scroll: zoom   •   drag: scrub   •   ⌥ drag: pan   •   right-click: add/delete S   •   Delete: remove selected"'
          if old in s: s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Validate patch markers
        shell: bash
        run: |
          grep -F 'let RGVersion = "0.2.15"' Sources/RGSibilanceStudio.swift
          grep -F 'Delete Sibilance' Sources/RGSibilanceStudio.swift
          grep -F 'onAddSibilance' Sources/RGSibilanceStudio.swift
          grep -F 'private func deleteEvent' Sources/RGSibilanceStudio.swift

      - name: Commit source and version
        shell: bash
        run: |
          printf '0.2.15\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift VERSION
          git commit -m "Release 0.2.15 direct waveform event editing"
          git push
