name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/patch_0_2_21.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.2.21"' Sources/RGSibilanceStudio.swift
          grep -F 'onEventFadesChanged' Sources/RGSibilanceStudio.swift
          grep -F 'visualGain(at:' Sources/RGSibilanceStudio.swift
          grep -F 'center fader: event gain' Sources/RGSibilanceStudio.swift
          grep -F 'fade dots: crossfade length' Sources/RGSibilanceStudio.swift
      - name: Commit source and version
        run: |
          printf '0.2.21\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift VERSION
          git commit -m "Release 0.2.21 direct waveform gain and fades"
          git push
