name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/fix_0_2_26_learning_name.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.2.26"' Sources/RGSibilanceStudio.swift
          grep -F 'referenceMorphSelected' Sources/RGSibilanceStudio.swift
          grep -F 'referenceBlendSelected' Sources/RGSibilanceStudio.swift
          grep -F 'RGExemplarStore' Sources/RGSibilanceStudio.swift
          grep -F 'final class RGExemplarStore' Sources/RGAdvancedEngine.swift
          grep -F 'RGAuditionMode' Sources/RGAdvancedEngine.swift
          grep -F 'renderAuditionMode' Sources/RGAdvancedEngine.swift
          grep -F 'processAdvanced' Sources/RGAdvancedEngine.swift
      - name: Commit source and version
        run: |
          printf '0.2.26\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift Sources/RGAdvancedEngine.swift VERSION
          git commit -m "Fix 0.2.26 exemplar learning store collision"
          git push
