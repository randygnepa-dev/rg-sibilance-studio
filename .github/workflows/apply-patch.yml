name: Apply RG source patch

on:
  push:
    branches: [main]
    paths:
      - 'PATCH_REQUEST'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 scripts/patch_0_3_2.py
      - name: Validate source
        run: |
          grep -F 'let RGVersion = "0.3.2"' Sources/RGSibilanceStudio.swift
          grep -F 'SPECTRAL TONE' Sources/RGSibilanceStudio.swift
          grep -F 'SET AS REFERENCE' Sources/RGSibilanceStudio.swift
          grep -F 'MATCH REFERENCE' Sources/RGSibilanceStudio.swift
          grep -F 'spectralTiltChanged' Sources/RGSibilanceStudio.swift
          grep -F 'matchSelectedToReference' Sources/RGSibilanceStudio.swift
          grep -F 'resonanceFilter' Sources/RGAdvancedEngine.swift
          grep -F 'applyPrebuilt' Sources/RGSibilanceStudio.swift
          grep -F '@main' Sources/RGSibilanceStudio.swift
      - name: Commit source and version
        run: |
          printf '0.3.2\n' > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/RGSibilanceStudio.swift Sources/RGAdvancedEngine.swift VERSION
          git commit -m "Release 0.3.2 spectral shape and reference matching"
          git push
