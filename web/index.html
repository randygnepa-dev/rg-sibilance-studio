<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RG Sibilance Lab</title><link rel="stylesheet" href="app.css"></head><body><header><b>RG SIBILANCE LAB</b><span>WEB ALPHA 0.1</span><label class="open">OPEN WAV<input id="file" type="file" accept="audio/wav,audio/*"></label><button id="analyze">ANALYZE</button><button id="play">▶ PLAY</button></header><main><section class="editor"><div class="ruler" id="ruler"></div><canvas id="wave"></canvas><div class="hint">Drag ruler = LOOP • click waveform = playhead • drag event = select</div></section><aside><h3>EVENTS</h3><div id="events"></div></aside><section class="modules"><article><h3>DETECTION</h3><button id="add">+ MARK S</button><div class="metric"><span>Events</span><b id="count">0</b></div></article><article class="repair"><h3>SIBILANCE REPAIR</h3><div class="row"><span>LEVEL</span><input id="level" type="range" min="-18" max="6" step="0.1" value="0"><b id="levelv">0.0 dB</b></div><div class="eq" id="eq"><div class="curve"></div><div class="node" id="node" title="De-whistle"></div><small>2k　4k　8k　12k　20k</small></div><div class="row"><span>TONE</span><input id="tone" type="range" min="-100" max="100" value="0"><b id="tonev">0</b></div><div class="row"><span>FLATTEN</span><input id="flatten" type="range" min="0" max="100" value="0"><b id="flattenv">0%</b></div></article><article><h3>REFERENCE</h3><button id="good">✓ SET GOOD</button><button id="match">MATCH REFERENCE</button><div id="ref">No reference</div></article><article><h3>PROCESS</h3><button id="bypass">BYPASS</button><button id="reset">RESET EVENT</button></article><article><h3>PREVIEW</h3><div class="metric"><span>Loop</span><b id="loop">OFF</b></div><div class="metric"><span>Time</span><b id="time">0:00.000</b></div></article></section></main><script src="app.js"></script></body></html>
